<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="UTF-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0">
				<title>Цифровая Бездна</title>
				<link rel="stylesheet" href="style.css">
</head>
	<body>

		<div class="void-container">
			<!-- Декоративные анимированные слои бездны под интерфейсом -->
			<div class="void-bg-glow"></div>
			<div class="void-mist"></div>
			<div id="vortex"></div>

			<!-- Рабочая зона интерфейса -->
			<div id="interface" class="interface-wrapper">
				<h1 class="title">Оставь это здесь</h1>
				<p class="subtitle">Напиши всё, что тебя злит, обижает или тревожит. Выплесни гнев без цензуры. Бездна уничтожит это навсегда.</p>

				<div class="input-area">
					<textarea id="void-input" placeholder="Начни писать сюда... Тебя никто не услышит и не осудит." maxlength="2000"></textarea>
				</div>

				<!-- ОБНОВЛЕННЫЙ БЛОК: Кнопка монетки сдвинута вправо и покрашена в серебро -->
				<div class="actions" style="display: flex; gap: 36px; justify-content: center; align-items: center;">
					<button id="btn-drop" class="btn-void">Отправить в бездну</button>

					<!-- Серебряная кнопка-монетка для доната -->
					<a href="https://pay.cloudtips.ru/p/7faedec5" target="_blank" class="btn-void" style="text-decoration: none; padding: 14px 20px; display: flex; align-items: center; justify-content: center;" title="Бросить монету на развитие Бездны">
						<span style="font-size: 1.2rem; filter: grayscale(1) brightness(1.2); display: inline-block;">🪙</span>
					</a>
				</div>
			</div>

			<!-- Финальный отклик Бездны -->
			<div id="void-response" class="void-response-text hidden">Бездна принимает это</div>
		</div>

		<!-- НОВЫЙ БЛОК: Ссылка на отдельную страницу -->
		<footer style="position: absolute; bottom: 20px; width: 100%; text-align: center; z-index: 100;">
			<a href="privacy.html" style="font-size: 0.8rem; color: #334155; text-decoration: none; letter-spacing: 0.05em; transition: color 0.3s ease;" onmouseover="this.style.color='#64748b'" onmouseout="this.style.color='#334155'">Конфиденциальность и информация</a>
		</footer>

		<script src="app.js"></script>
	</body>
</html>
